<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arrizabalaga</title>
<meta name="description" content="arrizabalaga.net · arrizabalaga.com">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%23ff5a36'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f3eee5;
    --ink:#151515;
    --net:#ff5a36;
    --com:#2f5bff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#111; --ink:#f3eee5; }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    display:grid;
    place-items:center;
    overflow:hidden;
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .domain{
    font-size:clamp(2.2rem, 10vw, 8.5rem);
    font-weight:800;
    letter-spacing:-0.04em;
    line-height:1;
    white-space:nowrap;
    display:flex;
    align-items:baseline;
    user-select:none;
  }
  .dot{
    display:inline-block;
    color:var(--current, var(--net));
    transition:color .4s;
  }
  .dot.hop{ animation:hop .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes hop{
    0%{transform:translateY(0) scale(1)}
    40%{transform:translateY(-35%) scale(1.3)}
    100%{transform:translateY(0) scale(1)}
  }

  /* Ambas palabras ocupan la misma celda: el ancho es el de la más larga */
  .tld{ display:inline-grid; }
  .word{ grid-area:1/1; display:inline-flex; }
  .word[data-w="net"]{ color:var(--net); }
  .word[data-w="com"]{ color:var(--com); }

  /* Cada letra: la capa exterior entra/sale, la interior baila */
  .ch{
    display:inline-block;
    opacity:0;
    transform:translateY(90%) rotate(30deg) scale(.5);
    transition:
      transform .7s cubic-bezier(.34,1.7,.64,1),
      opacity .25s ease;
    transition-delay:calc(var(--i) * 80ms);
  }
  .word.in .ch{ opacity:1; transform:none; }
  .word.out .ch{
    opacity:0;
    transform:translateY(-90%) rotate(-30deg) scale(.5);
    transition-timing-function:cubic-bezier(.55,0,.8,.2), ease;
    transition-duration:.45s, .45s;
  }
  .word.reset .ch{ transition:none; }

  .ch > span{ display:inline-block; transform-origin:50% 90%; }
  .word.in .ch > span{
    animation:dance 1.1s ease-in-out infinite;
    animation-delay:calc(.75s + var(--i) * .14s);
  }
  @keyframes dance{
    0%,100%{ transform:translateY(0) rotate(0) }
    20%{ transform:translateY(-14%) rotate(-9deg) }
    45%{ transform:translateY(0) rotate(0) scaleY(.94) }
    70%{ transform:translateY(-7%) rotate(7deg) }
  }

  @media (prefers-reduced-motion: reduce){
    .ch, .word.out .ch{ transition:opacity .4s; transform:none !important; }
    .word.in .ch > span, .dot.hop{ animation:none; }
  }
</style>
</head>
<body>
  <h1 class="domain" aria-label="arrizabalaga.net">
    <span>arrizabalaga</span><span class="dot">.</span><span class="tld" aria-hidden="true"></span>
  </h1>

<script>
  (function(){
    var words = ['net', 'com'];
    var tld = document.querySelector('.tld');
    var dot = document.querySelector('.dot');
    var h1  = document.querySelector('.domain');
    var root = document.documentElement;

    var els = words.map(function(w){
      var word = document.createElement('span');
      word.className = 'word';
      word.dataset.w = w;
      w.split('').forEach(function(c, i){
        var ch = document.createElement('span');
        ch.className = 'ch';
        ch.style.setProperty('--i', i);
        var inner = document.createElement('span');
        inner.textContent = c;
        ch.appendChild(inner);
        word.appendChild(ch);
      });
      tld.appendChild(word);
      return word;
    });

    var current = 0;

    function show(idx){
      var w = els[idx];
      w.classList.remove('out', 'reset');
      w.classList.add('in');
      root.style.setProperty('--current', 'var(--' + words[idx] + ')');
      h1.setAttribute('aria-label', 'arrizabalaga.' + words[idx]);
      dot.classList.remove('hop'); void dot.offsetWidth; dot.classList.add('hop');
    }

    function hide(idx){
      var w = els[idx];
      w.classList.remove('in');
      w.classList.add('out');
      setTimeout(function(){
        // vuelve a la posición de partida (abajo) sin transición
        w.classList.add('reset');
        w.classList.remove('out');
        void w.offsetWidth;
        w.classList.remove('reset');
      }, 700);
    }

    requestAnimationFrame(function(){ show(current); });

    setInterval(function(){
      hide(current);
      current = (current + 1) % words.length;
      setTimeout(function(){ show(current); }, 280);
    }, 3200);
  })();
</script>
</body>
</html>
